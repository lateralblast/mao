[package]
name = "mao"
version = "0.9.0"
description = "Multi AirPlay Output: send system audio to several AirPlay receivers at once"
license = "Apache-2.0"
edition = "2021"
publish = false

[lib]
name = "mao_lib"
crate-type = ["rlib"]

[[bin]]
name = "mao"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
objc2 = "0.6"

